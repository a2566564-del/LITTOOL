name: Build Release

# Makes the GitHub release of the version in Packages/com.litt.littool/package.json, tagged with that version:
#   com.litt.littool-<version>.zip    the VCC package (package.json at the zip root); the VCC listing points at it
#   LITTOOL_v<version>.unitypackage   installs to Assets/LITTOOL with the same GUIDs (tools/make_unitypackage.py)
#   package.json
# Runs when a push to main changes that package.json (a new version), or by hand (Actions > Build Release >
# Run workflow). A version that already has a tag is left alone. Build Repo Listing runs after this.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Packages/com.litt.littool/package.json

env:
  packageName: com.litt.littool
  packagePath: Packages/com.litt.littool

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # Checkout Local Repository
      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac

      # Get the Package version based on the package.json file
      - name: Get Version
        id: version
        uses: zoexx/github-action-json-file-properties@b9f36ce6ee6fe2680cd3c32b2c62e22eade7e590
        with:
            file_path: "${{ env.packagePath }}/package.json"
            prop_path: "version"

      # Configure the Environment Variables needed for releasing the Package
      - name: Set Environment Variables
        run: |
          echo "zipFile=${{ env.packageName }}-${{ steps.version.outputs.value }}.zip" >> $GITHUB_ENV
          echo "unityPackage=LITTOOL_v${{ steps.version.outputs.value }}.unitypackage" >> $GITHUB_ENV
          echo "version=${{ steps.version.outputs.value }}" >> $GITHUB_ENV

      # Leave a version that already has a release (tag) alone
      - name: Check Existing Tag
        id: existing
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ env.version }}" > /dev/null; then
            echo "Version ${{ env.version }} already has a tag; nothing to release."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # Zip the Package for release
      - name: Create Package Zip
        if: steps.existing.outputs.skip != 'true'
        working-directory: "${{ env.packagePath }}"
        run: zip -r "${{ github.workspace }}/${{ env.zipFile }}" .

      # Make the Assets/LITTOOL UnityPackage for people who do not use the VCC
      - name: Create UnityPackage
        if: steps.existing.outputs.skip != 'true'
        run: python3 tools/make_unitypackage.py "${{ github.workspace }}"

      # Make a release tag of the version from the package.json file
      - name: Create Tag
        if: steps.existing.outputs.skip != 'true'
        uses: rickstaa/action-create-tag@88dbf7ff6fe2405f8e8f6c6fdfd78829bc631f83
        with:
          tag: "${{ env.version }}"

      # Publish the Release to GitHub
      - name: Make Release
        if: steps.existing.outputs.skip != 'true'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          files: |
            ${{ env.zipFile }}
            ${{ env.unityPackage }}
            ${{ env.packagePath }}/package.json
          tag_name: ${{ env.version }}
